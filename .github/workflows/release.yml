name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Per-platform builds ──────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qbit-killswitch.exe
            suffix: windows-x64.exe

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: qbit-killswitch
            suffix: linux-x64

          - os: macos-latest      # Apple Silicon runner
            target: aarch64-apple-darwin
            binary: qbit-killswitch
            suffix: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libayatana-appindicator3-dev libxdo-dev

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          ARTIFACT="qbit-killswitch-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      # ── Windows installer (Inno Setup is pre-installed on windows-latest) ──
      # Use pwsh so /DAppVersion=... is not mangled by Git Bash path conversion.
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Copy binary where the ISS script expects it (target\release\).
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" `
                    "target\release\${{ matrix.binary }}"
          # Strip leading 'v' from tag (v0.4.0 → 0.4.0) for the AppVersion define.
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              "/DAppVersion=$ver" `
              "installer\qbit-killswitch.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Rename output to match the versioned artifact convention.
          $dst = "qbit-killswitch-$env:GITHUB_REF_NAME-setup.exe"
          Move-Item "installer\output\qbit-killswitch-setup-$ver.exe" $dst
          "INSTALLER=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER }}
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  # ── Collect, checksum, publish ───────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for LICENSE)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sha256sum \
            "qbit-killswitch-${VERSION}-setup.exe" \
            "qbit-killswitch-${VERSION}-windows-x64.exe" \
            "qbit-killswitch-${VERSION}-linux-x64" \
            "qbit-killswitch-${VERSION}-macos-arm64" \
            > checksums.txt
          echo "── checksums.txt ──"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qbit-killswitch-${{ github.ref_name }}-setup.exe
            dist/qbit-killswitch-${{ github.ref_name }}-windows-x64.exe
            dist/qbit-killswitch-${{ github.ref_name }}-linux-x64
            dist/qbit-killswitch-${{ github.ref_name }}-macos-arm64
            dist/checksums.txt
          body: |
            ## qbit-killswitch ${{ github.ref_name }}

            VPN killswitch daemon for qBittorrent — automatically pauses all torrents when your VPN drops and resumes them once it's restored.

            ---

            ### Requirements

            | Platform | Minimum |
            |---|---|
            | **Windows** | Windows 10 64-bit |
            | **Linux** | glibc 2.31+ (Ubuntu 20.04 / Debian 11 or newer); `libayatana-appindicator3` or `libgtk-3` installed |
            | **macOS** | macOS 11 Big Sur or newer |

            qBittorrent must have its **Web UI enabled** (Settings → Web UI).

            ---

            ### Downloads

            > **Windows users:** download the **installer** (`-setup.exe`) — it creates Start Menu and desktop shortcuts and removes itself cleanly on uninstall. The portable `.exe` is for advanced users who prefer a single file with no installation.

            | Platform | File | Notes |
            |---|---|---|
            | **Windows x64 (installer)** ⭐ | `qbit-killswitch-${{ github.ref_name }}-setup.exe` | **Recommended for most users** |
            | Windows x64 (portable) | `qbit-killswitch-${{ github.ref_name }}-windows-x64.exe` | Single executable, no installer |
            | Linux x64 | `qbit-killswitch-${{ github.ref_name }}-linux-x64` | |
            | macOS Apple Silicon | `qbit-killswitch-${{ github.ref_name }}-macos-arm64` | |

            Download `checksums.txt` alongside your file to verify integrity.

            ---

            ### Verifying SHA-256 checksums

            **Linux / macOS**
            ```bash
            sha256sum -c checksums.txt --ignore-missing
            ```

            **Windows — PowerShell**
            ```powershell
            Get-FileHash .\qbit-killswitch-${{ github.ref_name }}-setup.exe -Algorithm SHA256
            # Compare the hash above with the matching line in checksums.txt
            ```

            A passing verification prints `qbit-killswitch-...: OK`.

            ---

            ### Linux — first run
            ```bash
            chmod +x qbit-killswitch-${{ github.ref_name }}-linux-x64
            ./qbit-killswitch-${{ github.ref_name }}-linux-x64
            ```
